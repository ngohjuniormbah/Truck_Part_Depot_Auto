name: SEO branch validation

on:
  push:
    branches:
      - seo/production-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate sitemap generator syntax
        run: node --check scripts/generate-sitemap.mjs
      - name: Type-check
        run: npm run lint
      - name: Build production bundle
        run: npm run build
